<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Расчёты водителя</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffc629">
<link rel="icon" href="logo-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600&family=Noto+Sans+Georgian:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Gurmukhi:wght@400;600;700&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap">
<style>

/* Layout: a single friendly phone column with a language switch on top. Login, then one week at a time: payout hero, where the money went (one bar), where it came from, details on demand. Logical CSS properties so Urdu can run right-to-left. */
:root{--bg:#edf1ee;--card:#ffffff;--fg:#10241e;--mut:#5a6b64;--bd:#d9e1dc;--hero:#ffc629;--herofg:#10241e;--ink:#10241e;--inkfg:#f2f6f3;--pos:#12805c;--neg:#c8372d;--c1:#12805c;--c2:#10241e;--c3:#e08a00;--c4:#c8372d;--sans:"Onest","Noto Sans Georgian","Noto Sans Devanagari","Noto Sans Gurmukhi","Noto Naskh Arabic",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--disp:"Unbounded","Onest",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1411;--card:#13201b;--fg:#eef4f0;--mut:#9db0a6;--bd:#26372f;--ink:#eef4f0;--inkfg:#10241e;--pos:#4fd1a0;--neg:#ff8d82;--c1:#4fd1a0;--c2:#9db0a6;--c3:#ffb43a;--c4:#ff8d82;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1411;--card:#13201b;--fg:#eef4f0;--mut:#9db0a6;--bd:#26372f;--ink:#eef4f0;--inkfg:#10241e;--pos:#4fd1a0;--neg:#ff8d82;--c1:#4fd1a0;--c2:#9db0a6;--c3:#ffb43a;--c4:#ff8d82;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 48px}
.wrap{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.bar0{display:flex;justify-content:space-between;align-items:center;gap:10px}
.demo{font-size:.76rem;color:var(--mut);flex:1;min-width:0}
select{font:inherit;font-size:.9rem;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:7px 8px;flex:none;max-width:45%}
h1{font-size:1.7rem;line-height:1.2;margin:0;text-wrap:balance;font-weight:700}
h2{font-size:1rem;margin:0 0 10px;font-weight:700}
p{margin:0}.mut{color:var(--mut)}.small{font-size:.86rem}
label{display:block;font-weight:600;margin-bottom:6px}
input{font:inherit;font-size:1.1rem;color:var(--fg);background:var(--bg);border:2px solid var(--bd);border-radius:14px;padding:14px;width:100%}
input[type=tel],input[inputmode=numeric]{direction:ltr;text-align:start}
:is(input,button,summary,select):focus-visible{outline:3px solid var(--hero);outline-offset:2px}
.btn{font:inherit;font-weight:700;font-size:1.05rem;background:var(--hero);color:var(--herofg);border:0;border-radius:14px;padding:15px 16px;width:100%;cursor:pointer}
.link{background:none;border:0;color:var(--mut);font:inherit;text-decoration:underline;cursor:pointer;padding:8px 0}
.card{background:var(--card);border-radius:20px;padding:18px}
.stack{display:flex;flex-direction:column;gap:14px}
.logo{width:44px;height:44px;border-radius:50%;display:block;flex:none}
.mark{width:56px;height:56px;border-radius:16px;background:var(--hero);display:grid;place-items:center}
.top{display:flex;align-items:center;gap:12px}
.av{width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--inkfg);display:grid;place-items:center;font-weight:700;flex:none}
.top .t{flex:1;min-width:0}.top .t b{display:block;font-size:1.1rem}
.ghost{background:none;border:1px solid var(--bd);border-radius:10px;color:var(--mut);font:inherit;font-size:.85rem;padding:7px 10px;cursor:pointer}
.wk{display:flex;align-items:center;justify-content:space-between;gap:8px}
.arrow{width:44px;height:44px;border-radius:50%;border:0;background:var(--card);color:var(--fg);font-size:1.3rem;cursor:pointer;flex:none}
.arrow:disabled{opacity:.35;cursor:default}
.wk .mid{text-align:center;min-width:0}.wk .mid b{display:block;font-size:1.05rem;direction:ltr}
.hero{background:var(--hero);color:var(--herofg);border-radius:24px;padding:22px 20px}
.hero .lab{font-weight:600;font-size:.95rem;opacity:.8}
.hero .sum{font-family:var(--disp);font-weight:600;font-size:clamp(2rem,10vw,2.7rem);line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums;direction:ltr;text-align:start}
.hero .sum small{font-size:.5em;font-weight:500;margin-inline-start:4px}
.hero .sub{margin-top:10px;font-size:.92rem;opacity:.85}
.hero.debt{background:var(--card);color:var(--fg)}
.hero .sum{color:#0b6b4a}
.hero.debt .sum{color:var(--neg)}
.hero.debt .sum.zp{color:var(--pos)}
.bar{display:flex;gap:3px;height:16px;margin:14px 0 12px}
.bar i{display:block;border-radius:5px;min-width:6px}
.leg{display:flex;flex-direction:column;gap:2px}
.li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}
.li:last-child{border-bottom:0}
.dot{width:12px;height:12px;border-radius:4px;flex:none}
.li .nm{flex:1;min-width:0}.li .nm span{display:block}
.li b{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600;direction:ltr}
.neg{color:var(--neg)}.pos{color:var(--pos)}
details{border-top:1px solid var(--bd);margin-top:6px}
summary{cursor:pointer;font-weight:600;padding:12px 0 4px;list-style:none;display:flex;justify-content:space-between;gap:8px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:1.2rem;color:var(--mut)}
details[open] summary::after{content:"−"}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
td,th{padding:6px 0;border-bottom:1px solid var(--bd)}
th{font-weight:500;color:var(--mut);text-align:end;font-size:.8rem}
td:first-child,th:first-child{text-align:start}
td.n{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap;padding-inline-start:8px;direction:ltr}
tr:last-child td{border-bottom:0;font-weight:700}

.tabs{display:flex;gap:8px}
.tabs button{flex:1;font:inherit;font-weight:600;padding:11px 8px;border-radius:12px;border:2px solid var(--bd);background:var(--card);color:var(--fg);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--inkfg);border-color:var(--ink)}
.chipst{display:inline-block;font-size:.78rem;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);color:var(--mut)}
.chipst.ok{color:var(--pos);border-color:var(--pos)}.chipst.bad{color:var(--neg);border-color:var(--neg)}
input[type=file]{padding:10px}
.msgb{font-weight:600}
[hidden]{display:none!important}
body{margin:0}
</style>
</head>
<body>

<div class="wrap">
  <div class="bar0"><img class="logo" src="logo.png" alt="ALEX GROUP" width="44" height="44"><select id="lang" aria-label="Language"></select></div>
  <div id="inst" class="card" hidden style="display:none;background:var(--ink);color:var(--inkfg);padding:14px 16px">
    <div style="display:flex;align-items:center;gap:12px"><img src="logo.png" alt="" width="40" height="40" style="border-radius:50%;flex:none">
      <div style="flex:1;min-width:0"><b data-i="instTitle"></b><div class="small" id="instIos" data-i="instIos" style="opacity:.85;margin-top:2px" hidden></div></div>
      <button class="btn" id="instBtn" type="button" data-i="instBtn" style="width:auto;padding:11px 14px;font-size:.95rem" hidden></button>
      <button id="instX" type="button" aria-label="Close" style="background:none;border:0;color:inherit;font-size:1.4rem;line-height:1;cursor:pointer;padding:4px">×</button></div>
  </div>

  <section id="login" class="card stack" style="margin-top:6vh">
    <h1 data-i="loginTitle"></h1>
    <p class="mut" data-i="loginText"></p>
    <form id="f1" class="stack">
      <div><label for="ph" data-i="phone"></label><input id="ph" type="tel" inputmode="tel" autocomplete="tel" value="+48 " placeholder="+48 600 000 000"></div>
      <button class="btn" type="submit" id="b1" data-i="getCode"></button>
      <button class="link" type="button" id="have">У меня уже есть код / I already have a code</button>
    </form>
    <form id="f2" class="stack" hidden>
      <div><label for="cd" data-i="codeLabel"></label><input id="cd" inputmode="numeric" autocomplete="one-time-code" maxlength="8"></div>
      <button class="btn" type="submit" id="b2" data-i="enter"></button>
      <button class="link" type="button" id="back" data-i="changeNum"></button>
    </form>
    <p class="neg small" id="msg" role="alert"></p>
    <p class="mut small" data-i="onceNote"></p>
  </section>

  <section id="rodo" class="card stack" style="margin-top:4vh" hidden>
    <h1 id="rt"></h1>
    <div id="rb" class="small"></div>
    <label style="display:flex;gap:10px;align-items:flex-start"><input type="checkbox" id="rok" style="width:auto;margin-top:3px"><span id="rc"></span></label>
    <button class="btn" type="button" id="rk"></button>
    <p class="neg small" id="rmsg" role="alert"></p>
  </section>

  <main id="app" class="stack" hidden>
    <div class="top"><div class="av" id="av"></div><div class="t"><span class="mut small" id="hi"></span><b id="who"></b></div><button class="ghost" id="out" data-i="logout"></button></div>
    <div class="tabs"><button id="tS" aria-pressed="true" data-i="tabStat"></button><button id="tI" aria-pressed="false" data-i="tabInv"></button></div>
    <div id="content" class="stack">
      <div class="wk"><button class="arrow" id="prev"></button><div class="mid"><b id="wl"></b><span class="mut small" id="pub"></span></div><button class="arrow" id="next"></button></div>
      <div class="hero" id="hero"></div>
      <div class="card"><h2 data-i="where"></h2><div id="split"></div></div>
      <div class="card"><h2 data-i="src"></h2><div class="leg" id="src"></div>
        <details><summary data-i="details"></summary><div class="tw" id="full"></div></details>
      </div>
      <div class="card"><h2 data-i="faqTitle"></h2><div id="faq"></div></div>
      <p class="mut small" data-i="foot" style="text-align:center"></p>
    </div>
    <div id="invbox" class="stack" hidden>
      <div class="card stack">
        <h2 data-i="invTitle"></h2>
        <p class="mut small" data-i="invHelp"></p>
        <div><label for="im" data-i="invMonth"></label><input id="im" type="month"></div>
        <div><label data-i="invPick"></label><input id="if" type="file" accept="image/*,application/pdf" hidden><label class="btn" for="if" id="ifb" style="display:block;text-align:center;background:var(--ink);color:var(--inkfg)" data-i="invChoose"></label><p class="small mut" id="ifn" style="margin-top:6px"></p></div>
        <div><label for="ia" data-i="invAmount"></label><input id="ia" inputmode="decimal"></div>
        <div><label for="in" data-i="invNote"></label><input id="in"></div>
        <button class="btn" id="isend" data-i="invSend"></button>
        <p class="small msgb" id="imsg" role="status"></p>
      </div>
      <div class="card"><h2 data-i="invList"></h2><div id="ilist"></div></div>
    </div>
    <p class="mut" id="empty" hidden></p>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

ru:{faqTitle:"Частые вопросы",q1:"Заказ есть в приложении Uber, но в расчёте его нет. Почему?",a1:"Заказы, которые вы выполнили в Uber в ночь с воскресенья на понедельник, примерно с 00:00 до 04:00, могут зачисляться позже. Такие поездки не попадают в расчёт этой недели. Они приходят позже как корректировки: на следующей неделе или даже через неделю. Когда это произойдёт, они появятся в вашем кабинете в расчёте той недели, в которой пришли деньги. Ничего терять и делать не нужно: заказ не пропал, Uber просто платит за него с задержкой."},
uk:{faqTitle:"Часті запитання",q1:"Замовлення є в застосунку Uber, а в розрахунку його немає. Чому?",a1:"Замовлення, які ви виконали в Uber у ніч із неділі на понеділок, приблизно з 00:00 до 04:00, можуть зараховуватися пізніше. Такі поїздки не потрапляють у розрахунок цього тижня. Вони приходять згодом як коригування: наступного тижня або навіть через тиждень. Коли це станеться, вони з’являться у вашому кабінеті в розрахунку того тижня, коли надійшли гроші. Нічого втрачати чи робити не потрібно: замовлення не зникло, Uber просто платить за нього із затримкою."},
be:{faqTitle:"Частыя пытанні",q1:"Заказ ёсць у праграме Uber, а ў разліку яго няма. Чаму?",a1:"Заказы, якія вы выканалі ў Uber у ноч з нядзелі на панядзелак, прыкладна з 00:00 да 04:00, могуць залічвацца пазней. Такія паездкі не трапляюць у разлік гэтага тыдня. Яны прыходзяць пазней як карэкціроўкі: на наступным тыдні або нават праз тыдзень. Калі гэта адбудзецца, яны з’явяцца ў вашым кабінеце ў разліку таго тыдня, калі паступілі грошы. Нічога губляць ці рабіць не трэба: заказ не знік, Uber проста плаціць за яго з затрымкай."},
pl:{faqTitle:"Najczęstsze pytania",q1:"Zamówienie jest w aplikacji Uber, a w rozliczeniu go nie ma. Dlaczego?",a1:"Zamówienia wykonane w Uber w nocy z niedzieli na poniedziałek, mniej więcej od 00:00 do 04:00, mogą zostać zaksięgowane później. Takie przejazdy nie trafiają do rozliczenia tego tygodnia. Przychodzą później jako korekty: w następnym tygodniu, a czasem dopiero za tydzień. Gdy to nastąpi, pojawią się w Twoim koncie w rozliczeniu tygodnia, w którym wpłynęły pieniądze. Nic nie przepada i nic nie musisz robić: zamówienie nie zniknęło, Uber po prostu płaci za nie z opóźnieniem."},
en:{faqTitle:"Common questions",q1:"An order shows in the Uber app but not in my statement. Why?",a1:"Orders you completed in Uber on the night from Sunday to Monday, roughly 00:00 to 04:00, can be credited later. Those trips are not in this week's statement. They arrive later as adjustments: next week or even the week after. When that happens they will show in your account, in the statement for the week the money arrived. Nothing is lost and you do not need to do anything: the order has not disappeared, Uber just pays for it with a delay."},
ka:{faqTitle:"ხშირი კითხვები",q1:"შეკვეთა Uber-ის აპლიკაციაში ჩანს, მაგრამ ანგარიშში არ არის. რატომ?",a1:"შეკვეთები, რომლებიც Uber-ში კვირიდან ორშაბათზე გადასულ ღამეს, დაახლოებით 00:00-დან 04:00-მდე შეასრულეთ, შეიძლება მოგვიანებით ჩაირიცხოს. ასეთი მგზავრობები ამ კვირის ანგარიშში არ მოხვდება. ისინი მოგვიანებით მოდის კორექტირების სახით: მომდევნო კვირას ან კიდევ ერთი კვირის შემდეგ. როცა ეს მოხდება, ისინი თქვენს კაბინეტში გამოჩნდება იმ კვირის ანგარიშში, როცა თანხა შემოვიდა. არაფერი იკარგება და არაფრის გაკეთება არ გჭირდებათ: შეკვეთა არ გამქრალა, Uber მას უბრალოდ დაგვიანებით იხდის."},
hi:{faqTitle:"अक्सर पूछे जाने वाले सवाल",q1:"ऑर्डर Uber ऐप में दिख रहा है, लेकिन हिसाब में नहीं है। ऐसा क्यों?",a1:"रविवार से सोमवार की रात, लगभग 00:00 से 04:00 बजे के बीच, Uber में जो ऑर्डर आपने पूरे किए, उनका पैसा देर से जमा हो सकता है। ऐसी सवारियाँ इस सप्ताह के हिसाब में नहीं आतीं। वे बाद में सुधार (adjustment) के रूप में आती हैं: अगले सप्ताह या उससे अगले सप्ताह भी। जब ऐसा होगा, तो वे आपके कैबिनेट में उस सप्ताह के हिसाब में दिखेंगी जिसमें पैसा आया। कुछ भी खोता नहीं है और आपको कुछ करना नहीं है: ऑर्डर गायब नहीं हुआ, Uber बस उसका भुगतान देर से करता है।"},
pa:{faqTitle:"ਅਕਸਰ ਪੁੱਛੇ ਜਾਂਦੇ ਸਵਾਲ",q1:"ਆਰਡਰ Uber ਐਪ ਵਿੱਚ ਦਿਸਦਾ ਹੈ, ਪਰ ਹਿਸਾਬ ਵਿੱਚ ਨਹੀਂ ਹੈ। ਕਿਉਂ?",a1:"ਐਤਵਾਰ ਤੋਂ ਸੋਮਵਾਰ ਦੀ ਰਾਤ, ਲਗਭਗ 00:00 ਤੋਂ 04:00 ਵਜੇ ਤੱਕ, Uber ਵਿੱਚ ਜੋ ਆਰਡਰ ਤੁਸੀਂ ਪੂਰੇ ਕੀਤੇ, ਉਨ੍ਹਾਂ ਦਾ ਪੈਸਾ ਦੇਰ ਨਾਲ ਜਮ੍ਹਾਂ ਹੋ ਸਕਦਾ ਹੈ। ਅਜਿਹੀਆਂ ਸਵਾਰੀਆਂ ਇਸ ਹਫ਼ਤੇ ਦੇ ਹਿਸਾਬ ਵਿੱਚ ਨਹੀਂ ਆਉਂਦੀਆਂ। ਉਹ ਬਾਅਦ ਵਿੱਚ ਸੋਧ (adjustment) ਵਜੋਂ ਆਉਂਦੀਆਂ ਹਨ: ਅਗਲੇ ਹਫ਼ਤੇ ਜਾਂ ਉਸ ਤੋਂ ਅਗਲੇ ਹਫ਼ਤੇ ਵੀ। ਜਦੋਂ ਅਜਿਹਾ ਹੋਵੇਗਾ, ਉਹ ਤੁਹਾਡੇ ਕੈਬਿਨੇਟ ਵਿੱਚ ਉਸ ਹਫ਼ਤੇ ਦੇ ਹਿਸਾਬ ਵਿੱਚ ਦਿਖਣਗੀਆਂ ਜਿਸ ਵਿੱਚ ਪੈਸਾ ਆਇਆ। ਕੁਝ ਵੀ ਗੁੰਮ ਨਹੀਂ ਹੁੰਦਾ ਅਤੇ ਤੁਹਾਨੂੰ ਕੁਝ ਕਰਨ ਦੀ ਲੋੜ ਨਹੀਂ: ਆਰਡਰ ਗਾਇਬ ਨਹੀਂ ਹੋਇਆ, Uber ਇਸ ਦਾ ਭੁਗਤਾਨ ਸਿਰਫ਼ ਦੇਰ ਨਾਲ ਕਰਦਾ ਹੈ।"},
ur:{faqTitle:"عام سوالات",q1:"آرڈر Uber ایپ میں نظر آتا ہے مگر حساب میں نہیں ہے۔ کیوں؟",a1:"اتوار سے پیر کی رات، تقریباً 00:00 سے 04:00 بجے کے درمیان، Uber میں جو آرڈر آپ نے مکمل کیے، ان کی رقم دیر سے جمع ہو سکتی ہے۔ ایسی سواریاں اس ہفتے کے حساب میں شامل نہیں ہوتیں۔ وہ بعد میں ایڈجسٹمنٹ کے طور پر آتی ہیں: اگلے ہفتے یا اس سے اگلے ہفتے بھی۔ جب ایسا ہو گا تو وہ آپ کے کیبنٹ میں اس ہفتے کے حساب میں نظر آئیں گی جس میں رقم آئی۔ کچھ ضائع نہیں ہوتا اور آپ کو کچھ کرنے کی ضرورت نہیں: آرڈر غائب نہیں ہوا، Uber بس اس کی ادائیگی دیر سے کرتا ہے۔"}};

const FQ={"ru": [["Что значит «К выплате за неделю»?", "Это сумма после вычета комиссии, аренды, долгов и других удержаний. Выплаты переводит владелец парка в первый рабочий день недели. Деньги у вас на счёте на следующий рабочий день. Например, если понедельник в Польше выходной, первый рабочий день — вторник, перевод будет во вторник, а деньги у вас на счёте в среду. Если вместо этого показан «Долг на следующую неделю», переводить вам на этой неделе нечего."], ["Что такое «Получено наличными»?", "Это деньги, которые пассажиры заплатили вам наличными напрямую. Они уже у вас на руках, поэтому в переводе владельца не участвуют. Сумма считается по данным Uber, Bolt и FreeNow."], ["Как считается комиссия парка?", "Размер комиссии зависит от вашего дохода за неделю и от вашего тарифа. Итоговая сумма показана в строке «Комиссия парка». Если есть вопрос по комиссии, спросите владельца парка."], ["Почему вместо выплаты у меня «Долг на следующую неделю»?", "Если дохода за неделю не хватило на аренду, долги и другие удержания, непокрытая часть не пропадает: она переносится на следующую неделю."], ["Почему по одной из платформ у меня минус?", "Отрицательная сумма по Uber, Bolt или FreeNow (например, возврат пассажиру или штраф) уменьшает вашу выплату. На комиссию парка она не влияет."], ["Какие фактуры принимаются?", "Принимаются документы на топливо, запчасти и ремонт автомобиля, мойку и химчистку, а также на офисную технику, мобильные устройства и компьютеры. Чек (paragon) принимается только если на нём указан NIP фирмы. Не принимаются продукты, стройматериалы, поездки, развлечения, косметические услуги и документы WZ, KP, asygnata. Если в фактуре есть посторонние товары (сигареты, напитки, еда), её нужно разделить или заменить."], ["Мою фактуру отклонили. Что делать?", "Причина указана под документом на странице «Фактуры». Исправьте проблему и отправьте заново. Перед съёмкой убедитесь, что объектив камеры чистый и освещение достаточное, а документ виден целиком и текст читается."], ["Как войти с нового телефона?", "Введите тот же номер, который вы дали владельцу парка, и код из SMS. Если вы сменили номер, сообщите об этом владельцу: без этого войти не получится."], ["Где расчёты за прошлые недели?", "Над расчётом есть стрелки ‹ › для перехода между неделями."]], "uk": [["Що означає «До виплати за тиждень»?", "Це сума після вирахування комісії, оренди, боргів та інших утримань. Виплати переказує власник парку в перший робочий день тижня. Гроші на вашому рахунку наступного робочого дня. Наприклад, якщо понеділок у Польщі вихідний, перший робочий день — вівторок, переказ буде у вівторок, а гроші на рахунку у середу. Якщо замість цього показано «Борг на наступний тиждень», цього тижня переказувати вам нічого."], ["Що таке «Отримано готівкою»?", "Це гроші, які пасажири заплатили вам готівкою напряму. Вони вже у вас на руках, тому в переказі власника не беруть участі. Сума рахується за даними Uber, Bolt і FreeNow."], ["Як рахується комісія парку?", "Розмір комісії залежить від вашого доходу за тиждень і вашого тарифу. Підсумкова сума показана в рядку «Комісія парку». Якщо є питання щодо комісії, запитайте власника парку."], ["Чому замість виплати в мене «Борг на наступний тиждень»?", "Якщо доходу за тиждень не вистачило на оренду, борги та інші утримання, непокрита частина не зникає: вона переноситься на наступний тиждень."], ["Чому по одній із платформ у мене мінус?", "Від’ємна сума по Uber, Bolt або FreeNow (наприклад, повернення пасажиру чи штраф) зменшує вашу виплату. На комісію парку вона не впливає."], ["Які фактури приймаються?", "Приймаються документи на пальне, запчастини та ремонт авто, мийку й хімчистку, а також на офісну техніку, мобільні пристрої та комп’ютери. Чек (paragon) приймається лише якщо в ньому вказано NIP фірми. Не приймаються продукти, будматеріали, поїздки, розваги, косметичні послуги та документи WZ, KP, asygnata. Якщо у фактурі є сторонні товари (цигарки, напої, їжа), її потрібно розділити або замінити."], ["Мою фактуру відхилили. Що робити?", "Причина вказана під документом на сторінці «Фактури». Виправте проблему й надішліть знову. Перед зйомкою переконайтеся, що об’єктив камери чистий, освітлення достатнє, а документ видно повністю і текст читається."], ["Як увійти з нового телефона?", "Введіть той самий номер, який ви дали власнику парку, і код із SMS. Якщо ви змінили номер, повідомте власника: без цього увійти не вийде."], ["Де розрахунки за минулі тижні?", "Над розрахунком є стрілки ‹ › для переходу між тижнями."]], "be": [["Што азначае «Да выплаты за тыдзень»?", "Гэта сума пасля вылічэння камісіі, арэнды, даўгоў і іншых утрыманняў. Выплаты пераводзіць уладальнік парку ў першы працоўны дзень тыдня. Грошы на вашым рахунку на наступны працоўны дзень. Напрыклад, калі панядзелак у Польшчы выходны, першы працоўны дзень — аўторак, перавод будзе ў аўторак, а грошы на рахунку ў сераду. Калі замест гэтага паказана «Доўг на наступны тыдзень», на гэтым тыдні пераводзіць вам нечага."], ["Што такое «Атрымана наяўнымі»?", "Гэта грошы, якія пасажыры заплацілі вам наяўнымі наўпрост. Яны ўжо ў вас на руках, таму ў пераводзе ўладальніка не ўдзельнічаюць. Сума лічыцца па дадзеных Uber, Bolt і FreeNow."], ["Як лічыцца камісія парку?", "Памер камісіі залежыць ад вашага даходу за тыдзень і вашага тарыфу. Выніковая сума паказана ў радку «Камісія парку». Калі ёсць пытанні па камісіі, спытайце ўладальніка парку."], ["Чаму замест выплаты ў мяне «Доўг на наступны тыдзень»?", "Калі даходу за тыдзень не хапіла на арэнду, даўгі і іншыя ўтрыманні, непакрытая частка не знікае: яна пераносіцца на наступны тыдзень."], ["Чаму па адной з платформаў у мяне мінус?", "Адмоўная сума па Uber, Bolt або FreeNow (напрыклад, вяртанне пасажыру ці штраф) змяншае вашу выплату. На камісію парку яна не ўплывае."], ["Якія фактуры прымаюцца?", "Прымаюцца дакументы на паліва, запчасткі і рамонт аўто, мыйку і хімчыстку, а таксама на офісную тэхніку, мабільныя прылады і кампутары. Чэк (paragon) прымаецца толькі калі ў ім указаны NIP фірмы. Не прымаюцца прадукты, будматэрыялы, паездкі, забавы, касметычныя паслугі і дакументы WZ, KP, asygnata. Калі ў фактуры ёсць староннія тавары (цыгарэты, напоі, ежа), яе трэба падзяліць або замяніць."], ["Маю фактуру адхілілі. Што рабіць?", "Прычына паказана пад дакументам на старонцы «Фактуры». Выпраўце праблему і адпраўце зноў. Перад здымкай пераканайцеся, што аб’ектыў камеры чысты, асвятленне дастатковае, а дакумент відаць цалкам і тэкст чытаецца."], ["Як увайсці з новага тэлефона?", "Увядзіце той самы нумар, які вы далі ўладальніку парку, і код з SMS. Калі вы змянілі нумар, паведаміце ўладальніку: без гэтага ўвайсці не атрымаецца."], ["Дзе разлікі за мінулыя тыдні?", "Над разлікам ёсць стрэлкі ‹ › для пераходу паміж тыднямі."]], "pl": [["Co oznacza „Do wypłaty za tydzień”?", "To kwota po odliczeniu prowizji, wynajmu, zadłużeń i innych potrąceń. Wypłaty przelewa właściciel floty w pierwszym dniu roboczym tygodnia. Pieniądze są na Twoim koncie w kolejnym dniu roboczym. Na przykład, jeśli poniedziałek w Polsce jest dniem wolnym, pierwszym dniem roboczym jest wtorek, przelew zostanie wykonany we wtorek, a pieniądze będą na koncie w środę. Jeśli zamiast tego widzisz „Dług na następny tydzień”, w tym tygodniu nie ma nic do przelania."], ["Co to jest „Otrzymano gotówką”?", "To pieniądze, które pasażerowie zapłacili Ci bezpośrednio gotówką. Masz je już przy sobie, więc nie biorą udziału w przelewie właściciela. Kwota jest liczona na podstawie danych Uber, Bolt i FreeNow."], ["Jak liczona jest prowizja floty?", "Wysokość prowizji zależy od Twojego dochodu w tygodniu i Twojej stawki. Końcowa kwota jest w wierszu „Prowizja floty”. W razie pytań o prowizję zapytaj właściciela floty."], ["Dlaczego zamiast wypłaty mam „Dług na następny tydzień”?", "Jeśli dochodu z tygodnia nie wystarczyło na wynajem, zadłużenia i inne potrącenia, niepokryta część nie znika: przechodzi na następny tydzień."], ["Dlaczego przy jednej z platform mam minus?", "Ujemna kwota w Uber, Bolt lub FreeNow (np. zwrot dla pasażera lub kara) zmniejsza Twoją wypłatę. Nie wpływa na prowizję floty."], ["Jakie faktury są przyjmowane?", "Przyjmujemy dokumenty na paliwo, części i naprawy samochodu, myjnię i pranie tapicerki, a także na sprzęt biurowy, urządzenia mobilne i komputery. Paragon jest przyjmowany tylko z NIP firmy. Nie przyjmujemy produktów spożywczych, materiałów budowlanych, przejazdów, rozrywki, usług kosmetycznych ani dokumentów WZ, KP, asygnata. Jeśli na fakturze są obce towary (papierosy, napoje, jedzenie), trzeba ją rozdzielić lub wymienić."], ["Moja faktura została odrzucona. Co robić?", "Powód jest podany pod dokumentem na stronie „Faktury”. Popraw problem i wyślij ponownie. Przed zrobieniem zdjęcia upewnij się, że obiektyw aparatu jest czysty, oświetlenie wystarczające, a dokument widoczny w całości i tekst czytelny."], ["Jak zalogować się z nowego telefonu?", "Wpisz ten sam numer, który podałeś właścicielowi floty, i kod z SMS. Jeśli zmieniłeś numer, poinformuj właściciela: bez tego nie uda się zalogować."], ["Gdzie są rozliczenia z poprzednich tygodni?", "Nad rozliczeniem są strzałki ‹ › do przechodzenia między tygodniami."]], "en": [["What does “To be paid for the week” mean?", "It is the amount left after the fleet commission, rent, debts and other deductions. The fleet owner transfers payouts on the first working day of the week. The money is in your account on the next working day. For example, if Monday is a public holiday in Poland, the first working day is Tuesday, the transfer is made on Tuesday and the money is in your account on Wednesday. If you see “Debt for next week” instead, there is nothing to transfer to you this week."], ["What is “Received in cash”?", "It is money passengers paid you directly in cash. You already have it, so it is not part of the owner’s transfer. It is calculated from Uber, Bolt and FreeNow data."], ["How is the fleet commission calculated?", "The commission depends on your income for the week and your rate. The final amount is shown in the “Fleet commission” line. If you have a question about the commission, ask the fleet owner."], ["Why do I have “Debt for next week” instead of a payout?", "If the week’s income was not enough to cover rent, debts and other deductions, the uncovered part does not disappear: it carries over to the next week."], ["Why is one of my platforms negative?", "A negative amount in Uber, Bolt or FreeNow (for example a refund to a passenger or a penalty) reduces your payout. It does not affect the fleet commission."], ["Which invoices are accepted?", "We accept documents for fuel, car parts and repairs, car wash and cleaning, and also for office equipment, mobile devices and computers. A receipt (paragon) is accepted only if it shows the company NIP. Not accepted: groceries, building materials, rides, entertainment, cosmetic services and WZ, KP, asygnata documents. If an invoice includes unrelated items (cigarettes, drinks, food), it must be split or replaced."], ["My invoice was rejected. What should I do?", "The reason is shown under the document on the “Invoices” page. Fix the problem and send it again. Before taking the photo, make sure the camera lens is clean and the light is good enough, and that the whole document is visible and the text is readable."], ["How do I log in from a new phone?", "Enter the same number you gave the fleet owner and the code from the SMS. If you changed your number, tell the owner: without that you will not be able to log in."], ["Where are my statements for past weeks?", "Above the statement there are ‹ › arrows to move between weeks."]], "ka": [["რას ნიშნავს „კვირის გადასახდელი“?", "ეს არის თანხა საკომისიოს, ქირის, ვალებისა და სხვა გამოქვითვების გამოკლების შემდეგ. გადახდებს პარკის მფლობელი აკეთებს კვირის პირველ სამუშაო დღეს. ფული თქვენს ანგარიშზე მომდევნო სამუშაო დღეს აისახება. მაგალითად, თუ პოლონეთში ორშაბათი დასვენების დღეა, პირველი სამუშაო დღე სამშაბათია, გადარიცხვა სამშაბათს განხორციელდება, ფული კი ანგარიშზე ოთხშაბათს იქნება. თუ ამის ნაცვლად „ვალი მომდევნო კვირისთვის“ ჩანს, ამ კვირაში გადასარიცხი არაფერია."], ["რა არის „მიღებულია ნაღდი ფულით“?", "ეს არის ფული, რომელიც მგზავრებმა პირდაპირ ნაღდით გადაგიხადეს. ის უკვე თქვენთანაა, ამიტომ მფლობელის გადარიცხვაში არ მონაწილეობს. თანხა გამოითვლება Uber-ის, Bolt-ისა და FreeNow-ის მონაცემებით."], ["როგორ გამოითვლება პარკის საკომისიო?", "საკომისიო დამოკიდებულია თქვენს კვირის შემოსავალსა და თქვენს ტარიფზე. საბოლოო თანხა ჩანს ხაზში „პარკის საკომისიო“. საკომისიოს შესახებ შეკითხვის შემთხვევაში მიმართეთ პარკის მფლობელს."], ["რატომ მაქვს გადახდის ნაცვლად „ვალი მომდევნო კვირისთვის“?", "თუ კვირის შემოსავალი არ გაკმარა ქირაზე, ვალებსა და სხვა გამოქვითვებზე, დაუფარავი ნაწილი არ ქრება: ის გადადის მომდევნო კვირაზე."], ["რატომ მაქვს ერთ პლატფორმაზე მინუსი?", "უარყოფითი თანხა Uber-ში, Bolt-სა ან FreeNow-ში (მაგალითად, მგზავრისთვის დაბრუნება ან ჯარიმა) ამცირებს თქვენს გადასახდელს. პარკის საკომისიოზე გავლენას არ ახდენს."], ["რომელი ფაქტურები მიიღება?", "მიიღება დოკუმენტები საწვავზე, ავტომობილის ნაწილებსა და რემონტზე, სამრეცხაოსა და ქიმწმენდაზე, ასევე საოფისე ტექნიკაზე, მობილურ მოწყობილობებსა და კომპიუტერებზე. ქვითარი (paragon) მიიღება მხოლოდ კომპანიის NIP-ით. არ მიიღება პროდუქტები, სამშენებლო მასალები, მგზავრობა, გართობა, კოსმეტიკური მომსახურება და WZ, KP, asygnata დოკუმენტები. თუ ფაქტურაში სხვა საქონელიცაა (სიგარეტი, სასმელი, საკვები), ის უნდა გაიყოს ან შეიცვალოს."], ["ჩემი ფაქტურა უარყვეს. რა ვქნა?", "მიზეზი მითითებულია დოკუმენტის ქვეშ გვერდზე „ფაქტურები“. გამოასწორეთ პრობლემა და გააგზავნეთ თავიდან. გადაღებამდე დარწმუნდით, რომ კამერის ობიექტივი სუფთაა, განათება საკმარისია, დოკუმენტი მთლიანად ჩანს და ტექსტი იკითხება."], ["როგორ შევიდე ახალი ტელეფონიდან?", "შეიყვანეთ იგივე ნომერი, რომელიც პარკის მფლობელს მიეცით, და SMS-ის კოდი. თუ ნომერი შეიცვალეთ, შეატყობინეთ მფლობელს: სხვაგვარად ვერ შეხვალთ."], ["სად არის წინა კვირების ანგარიშები?", "ანგარიშის ზემოთ არის ისრები ‹ › კვირებს შორის გადასასვლელად."]], "hi": [["«सप्ताह का भुगतान» का क्या मतलब है?", "यह कमीशन, किराया, कर्ज़ और अन्य कटौतियों के बाद की रकम है। भुगतान पार्क का मालिक सप्ताह के पहले कार्य दिवस पर ट्रांसफर करता है। पैसा अगले कार्य दिवस पर आपके खाते में आ जाता है। उदाहरण के लिए, अगर पोलैंड में सोमवार की छुट्टी है, तो पहला कार्य दिवस मंगलवार है, ट्रांसफर मंगलवार को होगा और पैसा बुधवार को आपके खाते में होगा। अगर इसकी जगह «अगले सप्ताह का कर्ज़» दिख रहा है, तो इस सप्ताह आपको कुछ ट्रांसफर नहीं होगा।"], ["«नकद में मिला» क्या है?", "यह वह पैसा है जो यात्रियों ने सीधे आपको नकद दिया। यह पहले से आपके पास है, इसलिए मालिक के ट्रांसफर में शामिल नहीं होता। रकम Uber, Bolt और FreeNow के डेटा से गिनी जाती है।"], ["पार्क का कमीशन कैसे गिना जाता है?", "कमीशन आपकी साप्ताहिक आय और आपके टैरिफ पर निर्भर करता है। अंतिम रकम «पार्क कमीशन» पंक्ति में दिखती है। कमीशन के बारे में सवाल हो तो पार्क के मालिक से पूछें।"], ["भुगतान की जगह «अगले सप्ताह का कर्ज़» क्यों है?", "अगर सप्ताह की आय किराए, कर्ज़ और अन्य कटौतियों के लिए कम पड़ी, तो बिना चुकाया हिस्सा गायब नहीं होता: वह अगले सप्ताह में चला जाता है।"], ["एक प्लेटफ़ॉर्म पर माइनस क्यों है?", "Uber, Bolt या FreeNow में नकारात्मक रकम (जैसे यात्री को रिफ़ंड या जुर्माना) आपके भुगतान को घटाती है। इसका पार्क के कमीशन पर असर नहीं पड़ता।"], ["कौन से बिल (फ़ैक्चुरा) स्वीकार होते हैं?", "ईंधन, गाड़ी के पुर्ज़े और मरम्मत, कार धुलाई और सफ़ाई के साथ-साथ ऑफ़िस उपकरण, मोबाइल डिवाइस और कंप्यूटर के दस्तावेज़ स्वीकार होते हैं। रसीद (paragon) तभी स्वीकार होती है जब उस पर कंपनी का NIP हो। किराने का सामान, निर्माण सामग्री, सफ़र, मनोरंजन, कॉस्मेटिक सेवाएँ और WZ, KP, asygnata दस्तावेज़ स्वीकार नहीं हैं। अगर बिल में असंबंधित चीज़ें (सिगरेट, पेय, खाना) हैं, तो उसे अलग करना या बदलना होगा।"], ["मेरा बिल अस्वीकार हो गया। क्या करूँ?", "कारण «फ़ैक्चुरा» पेज पर दस्तावेज़ के नीचे लिखा है। समस्या ठीक करके दोबारा भेजें। फ़ोटो लेने से पहले देखें कि कैमरे का लेंस साफ़ है, रोशनी पर्याप्त है, और पूरा दस्तावेज़ दिख रहा है और लिखावट पढ़ी जा रही है।"], ["नए फ़ोन से लॉग इन कैसे करूँ?", "वही नंबर डालें जो आपने पार्क के मालिक को दिया था, और SMS का कोड डालें। अगर नंबर बदला है, तो मालिक को बताएँ, वरना लॉग इन नहीं होगा।"], ["पिछले सप्ताहों का हिसाब कहाँ है?", "हिसाब के ऊपर सप्ताह बदलने के लिए ‹ › तीर हैं।"]], "pa": [["«ਹਫ਼ਤੇ ਦੀ ਅਦਾਇਗੀ» ਦਾ ਕੀ ਮਤਲਬ ਹੈ?", "ਇਹ ਕਮਿਸ਼ਨ, ਕਿਰਾਇਆ, ਕਰਜ਼ੇ ਅਤੇ ਹੋਰ ਕਟੌਤੀਆਂ ਤੋਂ ਬਾਅਦ ਦੀ ਰਕਮ ਹੈ। ਅਦਾਇਗੀ ਪਾਰਕ ਦਾ ਮਾਲਕ ਹਫ਼ਤੇ ਦੇ ਪਹਿਲੇ ਕੰਮਕਾਜੀ ਦਿਨ ਟ੍ਰਾਂਸਫਰ ਕਰਦਾ ਹੈ। ਪੈਸੇ ਅਗਲੇ ਕੰਮਕਾਜੀ ਦਿਨ ਤੁਹਾਡੇ ਖਾਤੇ ਵਿੱਚ ਹੁੰਦੇ ਹਨ। ਉਦਾਹਰਣ ਲਈ, ਜੇ ਪੋਲੈਂਡ ਵਿੱਚ ਸੋਮਵਾਰ ਦੀ ਛੁੱਟੀ ਹੈ, ਤਾਂ ਪਹਿਲਾ ਕੰਮਕਾਜੀ ਦਿਨ ਮੰਗਲਵਾਰ ਹੈ, ਟ੍ਰਾਂਸਫਰ ਮੰਗਲਵਾਰ ਨੂੰ ਹੋਵੇਗਾ ਅਤੇ ਪੈਸੇ ਬੁੱਧਵਾਰ ਨੂੰ ਖਾਤੇ ਵਿੱਚ ਹੋਣਗੇ। ਜੇ ਇਸ ਦੀ ਥਾਂ «ਅਗਲੇ ਹਫ਼ਤੇ ਲਈ ਕਰਜ਼ਾ» ਦਿਸ ਰਿਹਾ ਹੈ, ਤਾਂ ਇਸ ਹਫ਼ਤੇ ਤੁਹਾਨੂੰ ਟ੍ਰਾਂਸਫਰ ਕਰਨ ਲਈ ਕੁਝ ਨਹੀਂ ਹੈ।"], ["«ਨਕਦ ਮਿਲਿਆ» ਕੀ ਹੈ?", "ਇਹ ਉਹ ਪੈਸੇ ਹਨ ਜੋ ਸਵਾਰੀਆਂ ਨੇ ਸਿੱਧੇ ਤੁਹਾਨੂੰ ਨਕਦ ਦਿੱਤੇ। ਇਹ ਪਹਿਲਾਂ ਹੀ ਤੁਹਾਡੇ ਕੋਲ ਹਨ, ਇਸ ਲਈ ਮਾਲਕ ਦੇ ਟ੍ਰਾਂਸਫਰ ਵਿੱਚ ਸ਼ਾਮਲ ਨਹੀਂ ਹੁੰਦੇ। ਰਕਮ Uber, Bolt ਅਤੇ FreeNow ਦੇ ਡਾਟੇ ਤੋਂ ਗਿਣੀ ਜਾਂਦੀ ਹੈ।"], ["ਪਾਰਕ ਦਾ ਕਮਿਸ਼ਨ ਕਿਵੇਂ ਗਿਣਿਆ ਜਾਂਦਾ ਹੈ?", "ਕਮਿਸ਼ਨ ਤੁਹਾਡੀ ਹਫ਼ਤਾਵਾਰੀ ਕਮਾਈ ਅਤੇ ਤੁਹਾਡੇ ਟੈਰਿਫ਼ ਉੱਤੇ ਨਿਰਭਰ ਕਰਦਾ ਹੈ। ਅੰਤਿਮ ਰਕਮ «ਪਾਰਕ ਕਮਿਸ਼ਨ» ਲਾਈਨ ਵਿੱਚ ਦਿਖਾਈ ਜਾਂਦੀ ਹੈ। ਕਮਿਸ਼ਨ ਬਾਰੇ ਸਵਾਲ ਹੋਵੇ ਤਾਂ ਪਾਰਕ ਦੇ ਮਾਲਕ ਤੋਂ ਪੁੱਛੋ।"], ["ਅਦਾਇਗੀ ਦੀ ਥਾਂ «ਅਗਲੇ ਹਫ਼ਤੇ ਲਈ ਕਰਜ਼ਾ» ਕਿਉਂ ਹੈ?", "ਜੇ ਹਫ਼ਤੇ ਦੀ ਕਮਾਈ ਕਿਰਾਏ, ਕਰਜ਼ਿਆਂ ਅਤੇ ਹੋਰ ਕਟੌਤੀਆਂ ਲਈ ਪੂਰੀ ਨਾ ਪਈ, ਤਾਂ ਨਾ ਚੁਕਾਇਆ ਹਿੱਸਾ ਗਾਇਬ ਨਹੀਂ ਹੁੰਦਾ: ਉਹ ਅਗਲੇ ਹਫ਼ਤੇ ਵਿੱਚ ਚਲਾ ਜਾਂਦਾ ਹੈ।"], ["ਇੱਕ ਪਲੇਟਫਾਰਮ ਉੱਤੇ ਮਾਈਨਸ ਕਿਉਂ ਹੈ?", "Uber, Bolt ਜਾਂ FreeNow ਵਿੱਚ ਨੈਗੇਟਿਵ ਰਕਮ (ਜਿਵੇਂ ਸਵਾਰੀ ਨੂੰ ਰਿਫੰਡ ਜਾਂ ਜੁਰਮਾਨਾ) ਤੁਹਾਡੀ ਅਦਾਇਗੀ ਘਟਾਉਂਦੀ ਹੈ। ਇਸ ਦਾ ਪਾਰਕ ਦੇ ਕਮਿਸ਼ਨ ਉੱਤੇ ਅਸਰ ਨਹੀਂ ਪੈਂਦਾ।"], ["ਕਿਹੜੇ ਬਿੱਲ (ਫ਼ਾਕਤੂਰਾ) ਮੰਨੇ ਜਾਂਦੇ ਹਨ?", "ਤੇਲ, ਗੱਡੀ ਦੇ ਪੁਰਜ਼ੇ ਅਤੇ ਮੁਰੰਮਤ, ਕਾਰ ਧੁਆਈ ਅਤੇ ਸਫ਼ਾਈ, ਅਤੇ ਨਾਲ ਹੀ ਦਫ਼ਤਰੀ ਉਪਕਰਨ, ਮੋਬਾਈਲ ਡਿਵਾਈਸ ਅਤੇ ਕੰਪਿਊਟਰ ਦੇ ਦਸਤਾਵੇਜ਼ ਮੰਨੇ ਜਾਂਦੇ ਹਨ। ਰਸੀਦ (paragon) ਤਾਂ ਹੀ ਮੰਨੀ ਜਾਂਦੀ ਹੈ ਜੇ ਉਸ ਉੱਤੇ ਕੰਪਨੀ ਦਾ NIP ਹੋਵੇ। ਕਰਿਆਨਾ, ਉਸਾਰੀ ਸਮੱਗਰੀ, ਸਫ਼ਰ, ਮਨੋਰੰਜਨ, ਸੁੰਦਰਤਾ ਸੇਵਾਵਾਂ ਅਤੇ WZ, KP, asygnata ਦਸਤਾਵੇਜ਼ ਨਹੀਂ ਮੰਨੇ ਜਾਂਦੇ। ਜੇ ਬਿੱਲ ਵਿੱਚ ਹੋਰ ਚੀਜ਼ਾਂ (ਸਿਗਰਟ, ਪੀਣ ਵਾਲੀਆਂ ਚੀਜ਼ਾਂ, ਖਾਣਾ) ਹਨ, ਤਾਂ ਉਸ ਨੂੰ ਵੱਖ ਕਰਨਾ ਜਾਂ ਬਦਲਣਾ ਪਵੇਗਾ।"], ["ਮੇਰਾ ਬਿੱਲ ਰੱਦ ਹੋ ਗਿਆ। ਕੀ ਕਰਾਂ?", "ਕਾਰਨ «ਫ਼ਾਕਤੂਰੇ» ਪੰਨੇ ਉੱਤੇ ਦਸਤਾਵੇਜ਼ ਹੇਠਾਂ ਲਿਖਿਆ ਹੈ। ਸਮੱਸਿਆ ਠੀਕ ਕਰਕੇ ਦੁਬਾਰਾ ਭੇਜੋ। ਫ਼ੋਟੋ ਖਿੱਚਣ ਤੋਂ ਪਹਿਲਾਂ ਵੇਖੋ ਕਿ ਕੈਮਰੇ ਦਾ ਲੈਂਜ਼ ਸਾਫ਼ ਹੈ, ਰੋਸ਼ਨੀ ਕਾਫ਼ੀ ਹੈ, ਅਤੇ ਪੂਰਾ ਦਸਤਾਵੇਜ਼ ਦਿਖ ਰਿਹਾ ਹੈ ਤੇ ਲਿਖਤ ਪੜ੍ਹੀ ਜਾਂਦੀ ਹੈ।"], ["ਨਵੇਂ ਫ਼ੋਨ ਤੋਂ ਲੌਗਇਨ ਕਿਵੇਂ ਕਰਾਂ?", "ਉਹੀ ਨੰਬਰ ਪਾਓ ਜੋ ਤੁਸੀਂ ਪਾਰਕ ਦੇ ਮਾਲਕ ਨੂੰ ਦਿੱਤਾ ਸੀ, ਅਤੇ SMS ਦਾ ਕੋਡ ਪਾਓ। ਜੇ ਨੰਬਰ ਬਦਲਿਆ ਹੈ, ਤਾਂ ਮਾਲਕ ਨੂੰ ਦੱਸੋ, ਨਹੀਂ ਤਾਂ ਲੌਗਇਨ ਨਹੀਂ ਹੋਵੇਗਾ।"], ["ਪਿਛਲੇ ਹਫ਼ਤਿਆਂ ਦਾ ਹਿਸਾਬ ਕਿੱਥੇ ਹੈ?", "ਹਿਸਾਬ ਦੇ ਉੱਪਰ ਹਫ਼ਤੇ ਬਦਲਣ ਲਈ ‹ › ਤੀਰ ਹਨ।"]], "ur": [["«ہفتے کی ادائیگی» کا کیا مطلب ہے؟", "یہ کمیشن، کرایہ، قرض اور دیگر کٹوتیوں کے بعد کی رقم ہے۔ ادائیگی پارک کا مالک ہفتے کے پہلے کام کے دن منتقل کرتا ہے۔ رقم اگلے کام کے دن آپ کے اکاؤنٹ میں ہوتی ہے۔ مثال کے طور پر، اگر پولینڈ میں پیر کی چھٹی ہو تو پہلا کام کا دن منگل ہے، منتقلی منگل کو ہوگی اور رقم بدھ کو آپ کے اکاؤنٹ میں ہوگی۔ اگر اس کی جگہ «اگلے ہفتے کا قرض» نظر آئے تو اس ہفتے آپ کو منتقل کرنے کے لیے کچھ نہیں ہے۔"], ["«نقد وصول ہوا» کیا ہے؟", "یہ وہ رقم ہے جو مسافروں نے براہِ راست آپ کو نقد دی۔ یہ پہلے ہی آپ کے پاس ہے، اس لیے مالک کی منتقلی میں شامل نہیں ہوتی۔ رقم Uber، Bolt اور FreeNow کے ڈیٹا سے شمار ہوتی ہے۔"], ["پارک کا کمیشن کیسے شمار ہوتا ہے؟", "کمیشن آپ کی ہفتہ وار آمدنی اور آپ کے ٹیرف پر منحصر ہے۔ حتمی رقم «پارک کمیشن» کی لائن میں دکھائی جاتی ہے۔ کمیشن کے بارے میں سوال ہو تو پارک کے مالک سے پوچھیں۔"], ["ادائیگی کی جگہ «اگلے ہفتے کا قرض» کیوں ہے؟", "اگر ہفتے کی آمدنی کرائے، قرضوں اور دیگر کٹوتیوں کے لیے کافی نہ ہو تو غیر ادا شدہ حصہ ختم نہیں ہوتا: وہ اگلے ہفتے میں منتقل ہو جاتا ہے۔"], ["ایک پلیٹ فارم پر مائنس کیوں ہے؟", "Uber، Bolt یا FreeNow میں منفی رقم (مثلاً مسافر کو واپسی یا جرمانہ) آپ کی ادائیگی کم کرتی ہے۔ اس کا پارک کے کمیشن پر اثر نہیں پڑتا۔"], ["کون سے بل (فاکتورا) قبول ہوتے ہیں؟", "ایندھن، گاڑی کے پرزے اور مرمت، کار واش اور صفائی، نیز دفتری سامان، موبائل ڈیوائسز اور کمپیوٹر کے دستاویزات قبول ہوتے ہیں۔ رسید (paragon) صرف تب قبول ہوتی ہے جب اس پر کمپنی کا NIP ہو۔ کھانے پینے کا سامان، تعمیراتی مواد، سفر، تفریح، کاسمیٹک خدمات اور WZ، KP، asygnata دستاویزات قبول نہیں ہیں۔ اگر بل میں غیر متعلقہ چیزیں (سگریٹ، مشروبات، کھانا) ہوں تو اسے الگ کرنا یا بدلنا ہوگا۔"], ["میرا بل مسترد ہو گیا۔ کیا کروں؟", "وجہ «فاکتورے» صفحے پر دستاویز کے نیچے لکھی ہے۔ مسئلہ ٹھیک کر کے دوبارہ بھیجیں۔ تصویر لینے سے پہلے دیکھ لیں کہ کیمرے کا لینز صاف ہے، روشنی کافی ہے، اور پورا دستاویز نظر آ رہا ہے اور تحریر پڑھی جا رہی ہے۔"], ["نئے فون سے لاگ ان کیسے کروں؟", "وہی نمبر درج کریں جو آپ نے پارک کے مالک کو دیا تھا، اور SMS کا کوڈ درج کریں۔ اگر نمبر بدلا ہے تو مالک کو بتائیں، ورنہ لاگ ان نہیں ہوگا۔"], ["پچھلے ہفتوں کا حساب کہاں ہے؟", "حساب کے اوپر ہفتے بدلنے کے لیے ‹ › تیر ہیں۔"]]};

async function sha(buf){const h=await crypto.subtle.digest("SHA-256",buf);return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join("")}
async function prep(file){
 if(file.type==="application/pdf")return{blob:file,ext:"pdf",type:"application/pdf"};
 const img=await createImageBitmap(file);
 /* проверки качества идут по исходному фото, до сжатия */
 if(Math.max(img.width,img.height)<1000)throw{code:"small"};
 /* сжатие до ~150 КБ: уменьшаем размер и качество, пока файл не станет достаточно лёгким */
 const LIM=150*1024;let side=Math.min(1,1800/Math.max(img.width,img.height)),blob=null;
 for(let step=0;step<8;step++){
  const c=document.createElement("canvas");c.width=Math.round(img.width*side);c.height=Math.round(img.height*side);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  for(const q of [.8,.7,.6,.5]){blob=await new Promise(r=>c.toBlob(r,"image/jpeg",q));if(blob.size<=LIM)return{blob,ext:"jpg",type:"image/jpeg"}}
  side*=.85}
 return{blob,ext:"jpg",type:"image/jpeg"}}
async function loadInv(){

 if(r.error){$("ilist").textContent=T("invErr");return}
 const st={new:"stNew",ok:"stOk",bad:"stBad"};
 $("ilist").innerHTML=(r.data||[]).length?r.data.map(x=>{const d=new Date(x.created_at);return '<div class="li"><div class="nm"><span>'+p2(d.getDate())+"."+p2(d.getMonth()+1)+(x.amount?" · "+fm(x.amount)+" zł":"")+'</span>'+(x.note?'<span class="mut small">'+x.note.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))+'</span>':'')+'</div><span class="chipst '+x.status+'">'+T(st[x.status]||"stNew")+'</span></div>'}).join(""):'<p class="mut small">'+T("invNone")+'</p>'}

  const p=await prep(f),m=$("im").value||nowM(),path=me.id+"/"+m+"/"+hash.slice(0,20)+"."+p.ext;
