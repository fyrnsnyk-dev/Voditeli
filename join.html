 jn:"Full name",jp:"Phone number",js:"Send connection request",jb:"You were invited by: {name}",jc:"By pressing the button you allow ALEX Group to contact you and send an SMS code to sign in to the app.",jdm:"See the app demo",jdT2:"Request already sent",jdNew:"Send a request for another number",instT:"Install the app now",instB:"Install the app",instI:"On iPhone: tap “Share” → “Add to Home Screen”",iosT:"Detailed instructions for iPhone",iosS:"Open the link in Safari itself. If you tapped it in Telegram, WhatsApp, SMS or Gmail, it opens in a built-in window that has no “Add to Home Screen”. Copy the link and paste it into the Safari address bar. Private Browsing must be off.\nTap “Share” (a square with an up arrow at the bottom of the screen; on newer iPhones sometimes in the address bar).\nScroll the list down: “Add to Home Screen” is below “Copy”, “Add Bookmark” and “Find on Page”. Swipe up with your finger.\nIf it is not there, tap “Edit Actions” at the very bottom of the list and add “Add to Home Screen” to favorites.\nTap “Add to Home Screen” and then “Add”. The ALEX Group icon will appear on your screen.\nIf the option is still missing, write which iPhone and iOS version you have (Settings → General → About) and send a screenshot of the Share menu.",instA:"In the browser menu choose “Install app” or “Add to Home screen”",jdT:"Request sent",jd:"You will be able to log in to the app once an ALEX Group partner connects you. Log in with this phone number: {phone}. Remember it — an SMS code will be sent to it.",jdDup:"The request for {phone} has already been sent and is being processed. You will be able to log in after an ALEX Group partner connects you, with this phone number (an SMS code will be sent).",jo:"Open the app",e_code:"The link is not valid.",e_name:"Enter your full name.",e_phone:"Check the phone number.",e_self:"You cannot invite yourself.",e_limit:"Too many invitations. Try again later.",e_x:"Something went wrong. Please try again.",

 jn:"სახელი და გვარი",jp:"ტელეფონის ნომერი",js:"დაკავშირების მოთხოვნის გაგზავნა",jb:"გიწვია: {name}",jc:"ღილაკზე დაჭერით ეთანხმები, რომ ALEX Group დაგიკავშირდეს და გამოგიგზავნოს SMS კოდი აპლიკაციაში შესასვლელად.",jdm:"აპლიკაციის დემოს ნახვა",jdT2:"მოთხოვნა უკვე გაგზავნილია",jdNew:"მოთხოვნის გაგზავნა სხვა ნომერზე",instT:"დააყენეთ აპლიკაცია ახლავე",instB:"აპლიკაციის დაყენება",instI:"iPhone-ზე: დააჭირეთ „გაზიარება“ → „მთავარ ეკრანზე დამატება“",iosT:"დეტალური ინსტრუქცია iPhone-ისთვის",iosS:"გახსენით ბმული ზუსტად Safari-ში. თუ ბმულზე Telegram-ში, WhatsApp-ში, SMS-ში ან Gmail-ში დააჭირეთ, ის იხსნება ჩაშენებულ ფანჯარაში, სადაც „მთავარ ეკრანზე დამატება“ არ არის. დააკოპირეთ ბმული და ჩასვით Safari-ის მისამართის ველში. პირადი დათვალიერება გამორთული უნდა იყოს.\nდააჭირეთ „გაზიარებას“ (კვადრატი ზემოთ მიმართული ისრით ეკრანის ქვედა ნაწილში, ახალ iPhone-ებზე ზოგჯერ მისამართის ველში).\nგადაახვიეთ სია ქვემოთ: „მთავარ ეკრანზე დამატება“ არის „კოპირების“, „სანიშნის დამატების“ და „გვერდზე პოვნის“ ქვემოთ. გადაფურცლეთ თითით ზემოთ.\nთუ ის არ ჩანს, სიის ბოლოში დააჭირეთ „მოქმედებების რედაქტირებას“ და დაამატეთ „მთავარ ეკრანზე დამატება“ ფავორიტებში.\nდააჭირეთ „მთავარ ეკრანზე დამატებას“ და „დამატებას“. ALEX Group-ის ხატულა გამოჩნდება ეკრანზე.\nთუ პუნქტი მაინც არ ჩანს, მოგვწერეთ, რა iPhone და iOS ვერსია გაქვთ (პარამეტრები → ზოგადი → ამ მოწყობილობის შესახებ) და გამოგზავნეთ „გაზიარების“ მენიუს სკრინშოტი.",instA:"ბრაუზერის მენიუში აირჩიეთ „აპლიკაციის დაყენება“ ან „მთავარ ეკრანზე დამატება“",jdT:"მოთხოვნა გაგზავნილია",jd:"აპლიკაციაში შესვლა შესაძლებელი იქნება მას შემდეგ, რაც ALEX Group-ის პარტნიორი დაგაკავშირებთ. შესვლა მოხდება ამ ტელეფონის ნომრით: {phone}. დაიმახსოვრეთ — მასზე SMS კოდი მოვა.",jdDup:"ნომრით {phone} მოთხოვნა უკვე გაგზავნილია და მუშავდება. შესვლა შესაძლებელი იქნება ALEX Group-ის პარტნიორთან დაკავშირების შემდეგ, ამ ტელეფონის ნომრით (SMS კოდი მოვა).",jo:"აპლიკაციის გახსნა",e_code:"ბმული არასწორია.",e_name:"შეიყვანე სახელი და გვარი.",e_phone:"შეამოწმე ტელეფონის ნომერი.",e_self:"საკუთარი თავის მოწვევა შეუძლებელია.",e_limit:"ძალიან ბევრი მოწვევაა. სცადე მოგვიანებით.",e_x:"ვერ მოხერხდა. სცადე ხელახლა.",
 rt:"მოიყვანე მეგობარი — მიიღე {bonus} zł",rb:"შენი მეგობარი პირველ კვირას მუშაობს პარკის საკომისიოს გარეშე.\nბონუსი {bonus} zł შენს გადახდაში მოვა მეგობრის მუშაობის მე-{weeks} კვირის შემდეგ, თუ ის ჩვენთან გააგრძელებს მუშაობას.",rf:"ბონუსი მხოლოდ ახალი მძღოლებისთვისაა, რომლებიც ადრე ALEX Group-თან არ მუშაობდნენ. ALEX Group-ს შეუძლია ბონუსის დარიცხვაზე უარი თქვას ან აქცია დაასრულოს.",rm:"გამარჯობა! ვმუშაობ ALEX Group-თან — აპლიკაციაში ჩანს მთელი ანგარიშსწორება, გადახდები ყოველ კვირას. პირველი კვირა პარკის საკომისიოს გარეშეა. აი ბმული: {link}"},

 jn:"पूरा नाम",jp:"फ़ोन नंबर",js:"कनेक्शन अनुरोध भेजें",jb:"आपको बुलाया: {name}",jc:"बटन दबाकर आप ALEX Group को आपसे संपर्क करने और ऐप में लॉग इन के लिए SMS कोड भेजने की अनुमति देते हैं।",jdm:"ऐप का डेमो देखें",jdT2:"अनुरोध पहले ही भेजा जा चुका है",jdNew:"दूसरे नंबर के लिए अनुरोध भेजें",instT:"ऐप अभी इंस्टॉल करें",instB:"ऐप इंस्टॉल करें",instI:"iPhone पर: शेयर दबाएँ → 'होम स्क्रीन में जोड़ें'",iosT:"iPhone के लिए विस्तृत निर्देश",iosS:"लिंक सीधे Safari में खोलें। अगर आपने लिंक Telegram, WhatsApp, SMS या Gmail में दबाया है, तो वह एक इनबिल्ट विंडो में खुलता है जिसमें 'होम स्क्रीन में जोड़ें' नहीं होता। लिंक कॉपी करें और Safari के एड्रेस बार में पेस्ट करें। प्राइवेट ब्राउज़िंग बंद होनी चाहिए।\n'शेयर' दबाएँ (स्क्रीन के नीचे ऊपर की ओर तीर वाला वर्ग; नए iPhone में कभी-कभी एड्रेस बार में)।\nसूची को नीचे स्क्रॉल करें: 'होम स्क्रीन में जोड़ें' 'कॉपी करें', 'बुकमार्क जोड़ें', 'पेज पर खोजें' के नीचे होता है। उँगली से ऊपर की ओर स्वाइप करें।\nअगर वह नहीं दिखे, तो सूची के सबसे नीचे 'क्रियाएँ संपादित करें' दबाएँ और 'होम स्क्रीन में जोड़ें' को पसंदीदा में जोड़ें।\n'होम स्क्रीन में जोड़ें' और फिर 'जोड़ें' दबाएँ। ALEX Group का आइकन स्क्रीन पर आ जाएगा।\nअगर विकल्प फिर भी न दिखे, तो लिखें कि आपके पास कौन-सा iPhone और iOS वर्शन है (सेटिंग्स → सामान्य → इसके बारे में) और 'शेयर' मेनू का स्क्रीनशॉट भेजें।",instA:"ब्राउज़र मेनू में 'ऐप इंस्टॉल करें' या 'होम स्क्रीन में जोड़ें' चुनें",jdT:"अनुरोध भेज दिया गया",jd:"ALEX Group के पार्टनर द्वारा आपको जोड़ने के बाद आप ऐप में लॉगिन कर पाएँगे। लॉगिन इस फ़ोन नंबर से होगा: {phone}। इसे याद रखें — इस पर SMS कोड आएगा।",jdDup:"नंबर {phone} के लिए अनुरोध पहले ही भेजा जा चुका है और उस पर काम चल रहा है। ALEX Group के पार्टनर द्वारा जोड़ने के बाद आप इसी फ़ोन नंबर से लॉगिन कर पाएँगे (SMS कोड आएगा)।",jo:"ऐप खोलें",e_code:"लिंक सही नहीं है।",e_name:"पूरा नाम लिखें।",e_phone:"फ़ोन नंबर जाँचें।",e_self:"आप खुद को नहीं बुला सकते।",e_limit:"बहुत ज़्यादा निमंत्रण। बाद में कोशिश करें।",e_x:"नहीं हो सका। फिर कोशिश करें।",
