:root{--bg:#f6f3ee;--card:#fff;--fg:#1f1417;--mut:#6b6266;--bd:#e4ded6;--ac:#ffc629;--acf:#1f1417;--ok:#17703a;--bad:#b3261e;color-scheme:light}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Georgian","Noto Sans Devanagari","Noto Sans Gurmukhi","Noto Naskh Arabic",sans-serif}
.wrap{max-width:520px;margin:0 auto;padding:14px 16px 40px}.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.logo{width:44px;height:44px;border-radius:50%}select,input{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
input{width:100%}label{display:block;font-weight:600;margin:12px 0 4px}h1{font-size:1.35rem;line-height:1.25;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-top:12px}
.btn{display:block;width:100%;font:inherit;font-weight:700;background:var(--ac);color:var(--acf);border:0;border-radius:12px;padding:13px 14px;margin-top:14px;cursor:pointer;text-align:center;text-decoration:none}
.btn.g{background:transparent;color:var(--fg);border:1px solid var(--bd)}.row{display:flex;gap:8px}.row .btn{margin-top:8px}
.mut{color:var(--mut)}.small{font-size:.85rem}.bad{color:var(--bad);font-weight:600}.ok{color:var(--ok);font-weight:600}[hidden]{display:none!important}
.link{word-break:break-all;background:var(--bg);border:1px dashed var(--bd);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:.95rem;direction:ltr;text-align:left}
.li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--bd)}.li:first-child{border-top:0}.li span{color:var(--mut);font-size:.88rem;text-align:end}
